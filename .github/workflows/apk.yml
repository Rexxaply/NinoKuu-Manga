# Membangun APK Android Ninokuu (Capacitor) dari folder app/ setiap ada perubahan di main, atau manual dari tab Actions.
# Hasil: GitHub Release "apk-terbaru" berisi ninokuu.apk (link tetap, bisa dibagikan):
#   https://github.com/<pemilik>/<repo>/releases/download/apk-terbaru/ninokuu.apk
#
# Butuh secret: SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICES_JSON, APK_KEYSTORE_PASSWORD
# dan kunci dari workflow "Buat kunci APK" (dijalankan sekali).
# Nama paket diambil otomatis dari google-services.json (atau variabel APP_ID bila diisi).
name: Build APK

on:
  push:
    branches: [main]
    # APK baru dibangun saat berkas VERSION berubah (rilis), atau manual dari tab Actions.
    # Perubahan web biasa langsung tayang di versi web tanpa menunggu rilis APK.
    paths: ["VERSION", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apk
    # Rahasia TIDAK dipasang di level job: hanya langkah yang butuh yang menerimanya,
    # supaya skrip paket npm (npm install) tidak bisa membaca kata sandi kunci APK.
    env:
      APP_ID_VAR: ${{ vars.APP_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Periksa kunci dan secret
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ ! -f ninokuu.keystore.enc ]; then
            echo "::error::Kunci APK belum ada. Jalankan dulu workflow \"Buat kunci APK\" (tab Actions), lalu jalankan Build APK lagi."
            exit 1
          fi
          [ -n "$KS_PASS" ] || { echo "::error::Secret APK_KEYSTORE_PASSWORD kosong."; exit 1; }
          [ -n "$GSJ" ] || { echo "::error::Secret GOOGLE_SERVICES_JSON kosong (isi file google-services.json dari Firebase)."; exit 1; }
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KS_PASS -in ninokuu.keystore.enc -out "$RUNNER_TEMP/ninokuu.p12" \
            || { echo "::error::Kunci APK tidak bisa dibuka: APK_KEYSTORE_PASSWORD berbeda dengan saat kunci dibuat."; exit 1; }
          echo "KS_FILE=$RUNNER_TEMP/ninokuu.p12" >> "$GITHUB_ENV"

      - name: Nama paket dari google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          printf '%s' "$GSJ" > google-services.json
          node -e '
            const fs = require("fs"); let j;
            try { j = JSON.parse(fs.readFileSync("google-services.json", "utf8")); }
            catch { console.error("::error::GOOGLE_SERVICES_JSON bukan JSON yang valid. Tempel seluruh isi file google-services.json."); process.exit(1); }
            const pk = (j.client || []).map((c) => c?.client_info?.android_client_info?.package_name).filter(Boolean);
            const id = process.env.APP_ID_VAR || pk[0];
            if (!id || !pk.includes(id)) { console.error(`::error::Paket ${id || "(kosong)"} tidak ada di google-services.json (${pk.join(", ")}).`); process.exit(1); }
            if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(id)) { console.error("::error::Nama paket tidak valid: " + id); process.exit(1); }
            console.log("Firebase:", j.project_info?.project_id, "· paket:", id);
            fs.appendFileSync(process.env.GITHUB_ENV, "APP_ID=" + id + "\n");
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8")); c.appId = id;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));'

      - name: Berkas web + config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          rm -rf www && cp -r ../app www && rm -f www/sw.js
          python3 - <<'PY'
          import json, os, re, base64
          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          if not re.match(r"^https://[a-z0-9-]+\.supabase\.(co|in)$", url): raise SystemExit("::error::SUPABASE_URL harus https://xxxx.supabase.co")
          if key.startswith("sb_secret_"): raise SystemExit("::error::SUPABASE_ANON_KEY berisi kunci RAHASIA.")
          if key.startswith("eyJ"):
              part = key.split(".")[1]; part += "=" * (-len(part) % 4)
              if json.loads(base64.urlsafe_b64decode(part)).get("role") != "anon": raise SystemExit("::error::SUPABASE_ANON_KEY bukan kunci anon.")
          ver = open("../VERSION").read().strip()
          if not re.match(r"^\d+\.\d+\.\d+$", ver): raise SystemExit("::error::Isi berkas VERSION harus mayor.minor.patch, mis. 1.2.3")
          owner, name = os.environ["REPO"].split("/")
          cfg = {"SUPABASE_URL": url, "SUPABASE_ANON_KEY": key, "VERSION": ver, "BUILD": int(os.environ["BUILD"]), "REPO": os.environ["REPO"],
                 "WEB_URL": f"https://{owner.lower()}.github.io/{name}/"}
          open("www/config.js", "w").write("window.NINOKUU_CONFIG = " + json.dumps(cfg) + ";\n")
          print("config.js:", {k: v for k, v in cfg.items() if k != "SUPABASE_ANON_KEY"})
          PY

      - name: Pasang Capacitor
        run: npm install --no-audit --no-fund

      - name: Sisipkan JavaScript Capacitor (penghubung ke plugin native)
        run: |
          set -e
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          cp node_modules/@capacitor/push-notifications/dist/plugin.js www/cap-push.js
          cp node_modules/@capacitor/app/dist/plugin.js www/cap-app.js
          cp node_modules/@capacitor/keyboard/dist/plugin.js www/cap-kb.js
          grep -q "registerPlugin" www/cap-push.js && grep -q "registerPlugin" www/cap-app.js && grep -q "registerPlugin" www/cap-kb.js && grep -q "capacitorExports" www/capacitor.js
          sed -i 's#<script src="config.js"></script>#<script src="capacitor.js"></script>\n<script src="cap-push.js"></script>\n<script src="cap-app.js"></script>\n<script src="cap-kb.js"></script>\n<script src="config.js"></script>#' www/index.html
          [ "$(grep -c 'src="cap' www/index.html)" = "4" ] || { echo "::error::Gagal menyisipkan skrip Capacitor ke index.html"; exit 1; }

      - name: Proyek Android
        run: |
          set -e
          npx cap add android
          npx cap sync android
          R=android/app/src/main/res
          # ikon, ikon notifikasi, layar pembuka
          rm -rf $R/mipmap-anydpi-v26
          find $R -name "ic_launcher_foreground.png" -delete
          find $R -name "splash.png" -delete
          cp -r res/. $R/
          cp google-services.json android/app/google-services.json
          node -e '
            const fs = require("fs");
            // warna bilah status / navigasi & latar jendela mengikuti tema gelap Ninokuu
            const sf = "android/app/src/main/res/values/styles.xml"; let s = fs.readFileSync(sf, "utf8");
            const items = `<item name="android:statusBarColor">@color/ninokuu_bg</item>\n        <item name="android:navigationBarColor">@color/ninokuu_bg</item>\n        <item name="android:windowBackground">@color/ninokuu_bg</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>`;
            s = s.replace(/(<style name="AppTheme.NoActionBar"[^>]*>)/, `$1\n        ${items}`);
            s = s.replace(/(<style name="AppTheme.NoActionBarLaunch"[^>]*>)/, `$1\n        <item name="windowSplashScreenBackground">@color/ninokuu_bg</item>\n        ${items}`);
            fs.writeFileSync(sf, s);
            // izin notifikasi, ikon & channel default FCM, orientasi potret
            const mf = "android/app/src/main/AndroidManifest.xml"; let m = fs.readFileSync(mf, "utf8");
            if (!m.includes("POST_NOTIFICATIONS")) m = m.replace("</manifest>", `    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>`);
            m = m.replace("</application>", `    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_ninokuu" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="ninokuu" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ninokuu_red" />\n    </application>`);
            // layar menyusut saat keyboard muncul (kolom chat tidak tertutup keyboard)
            m = m.replace(/<activity\b/, `<activity\n            android:screenOrientation="portrait"` + (m.includes("windowSoftInputMode") ? "" : `\n            android:windowSoftInputMode="adjustResize"`));
            // keamanan: token sesi di penyimpanan WebView tidak ikut cadangan otomatis Android
            m = m.replace(/android:allowBackup="true"/, `android:allowBackup="false"`);
            if (!m.includes("android:allowBackup")) m = m.replace(/<application\b/, `<application\n        android:allowBackup="false"`);
            if (!m.includes("android:fullBackupContent")) m = m.replace(/<application\b/, `<application\n        android:fullBackupContent="false"`);
            fs.writeFileSync(mf, m);'
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml || { echo "::error::allowBackup belum false"; exit 1; }
          grep -n "ninokuu_bg" android/app/src/main/res/values/styles.xml | head -3
          grep -n "POST_NOTIFICATIONS\|ic_stat_ninokuu\|screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Tanda tangan & versi
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ninokuu {
                      storeFile file(System.getenv('KS_FILE'))
                      storeType 'pkcs12'
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'ninokuu'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.ninokuu }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          GRADLE
          # versionName = isi VERSION (mis. 1.2.3); versionCode = 1.002.003 → 1002003 (selalu naik bila versi naik)
          V=$(tr -d ' \n\r' < ../VERSION)
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: apk/android
        env:
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ninokuu.apk
          # pastikan APK ditandatangani kunci tetap Ninokuu
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          got=$("$AS" verify --print-certs ../ninokuu.apk | grep -m1 "SHA-256 digest" | sed 's/.*: *//' | tr 'a-f' 'A-F')
          want=$(tr -d ':\n ' < ../keystore-sha256.txt)
          echo "Sertifikat APK: $got"
          [ "$got" = "$want" ] || { echo "::error::APK tidak ditandatangani kunci Ninokuu ($got ≠ $want)"; exit 1; }
          ls -la ../ninokuu.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ninokuu-apk
          path: apk/ninokuu.apk

      - name: Terbitkan ke Release "apk-terbaru"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # catatan rilis = pesan commit terakhir (ditampilkan di peringatan pembaruan aplikasi)
          { git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed '/^[[:space:]]*$/d'
            echo ""
            echo "Dibangun otomatis dari commit ${{ github.sha }} · paket $APP_ID."
            echo "Unduh ninokuu.apk lalu pasang di HP Android. Pembaruan bisa dipasang langsung menimpa versi lama."; } > "$RUNNER_TEMP/notes.md"
          gh release delete apk-terbaru --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create apk-terbaru ninokuu.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Ninokuu v$APP_VERSION (build ${{ github.run_number }})" --latest --notes-file "$RUNNER_TEMP/notes.md"
          echo "### APK siap" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/apk-terbaru/ninokuu.apk" >> "$GITHUB_STEP_SUMMARY"
