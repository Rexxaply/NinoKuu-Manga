# Menjaga Supabase paket gratis agar tidak dijeda (jeda otomatis setelah 7 hari tanpa aktivitas).
# Ping database tiap 2 hari. Juga menjaga jadwal GitHub Actions ini sendiri tetap hidup:
# di repo publik, jadwal dimatikan GitHub bila repo tanpa commit ~60 hari, jadi workflow
# membuat commit kosong "chore: keepalive" bila commit terakhir sudah lebih dari 45 hari.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 2 */2 * *"   # tiap 2 hari, 09.17 WIB
  workflow_dispatch: {}

# Default: token tanpa izin apa pun. Hanya job yang butuh menulis yang diberi izin.
permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ping database Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi. Ping dilewati."
            echo "⚠️ Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi — ping dilewati. Lihat README." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL="${SUPABASE_URL%/}"
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d '{}') || true
            [ -n "$code" ] || code=000
            echo "Percobaan $i → HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20   # proyek yang baru bangun bisa butuh waktu
          done
          if [ "$ok" != "1" ]; then
            case "$code" in
              404) hint="keepalive.sql belum dijalankan di Supabase." ;;
              401|403) hint="Kunci SUPABASE_ANON_KEY salah atau terpotong." ;;
              000) hint="Tidak bisa terhubung: cek SUPABASE_URL atau proyek sedang dijeda (Restore di dashboard)." ;;
              *) hint="Cek dashboard Supabase." ;;
            esac
            echo "::error::Ping gagal (HTTP $code). $hint"
            exit 1
          fi

  keep-schedule-alive:
    # Hanya di branch utama, agar dispatch dari branch lain tidak membuat commit di sana.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Commit kosong bila repo sepi > 45 hari
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Commit terakhir: $days hari lalu"
          if [ "$days" -lt 45 ]; then exit 0; fi
          git config user.name "ninokuu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (jadwal GitHub Actions tetap aktif)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
