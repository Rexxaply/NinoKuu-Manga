# Menjaga Supabase paket gratis agar tidak dijeda (jeda otomatis setelah 7 hari tanpa aktivitas).
# Ping database tiap 2 hari. Juga menjaga jadwal GitHub Actions ini sendiri tetap hidup:
# di repo publik, jadwal dimatikan GitHub bila repo tanpa commit ~60 hari, jadi workflow
# membuat commit kosong "chore: keepalive" bila commit terakhir sudah lebih dari 45 hari.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 2 */2 * *"   # tiap 2 hari, 09.17 WIB
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi. Ping dilewati."
            exit 0
          fi
          URL="${SUPABASE_URL%/}"
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d '{}' || echo 000)
            echo "Percobaan $i → HTTP $code"; cat /tmp/out.txt; echo
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20   # proyek yang baru bangun bisa butuh waktu
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Ping gagal. Cek apakah keepalive.sql sudah dijalankan, atau proyek sudah terlanjur dijeda (pulihkan di dashboard Supabase)."
            exit 1
          fi

  keep-schedule-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Commit kosong bila repo sepi > 45 hari
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Commit terakhir: $days hari lalu"
          if [ "$days" -lt 45 ]; then exit 0; fi
          git config user.name "ninokuu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (jadwal GitHub Actions tetap aktif)"
          git push
